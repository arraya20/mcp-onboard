# Cloudflare Pages. The dashboard is static; the search endpoint is a Pages
# Function in functions/api/report.js.
#
# compatibility_date is pinned rather than left to wrangler's default, which
# changes over time and prints a warning on every run. Workers runtime behaviour
# is versioned by this date, so pinning it makes the deploy reproducible.
name = "pharos-mcp-onboard"
compatibility_date = "2026-11-04"
pages_build_output_dir = "public"
